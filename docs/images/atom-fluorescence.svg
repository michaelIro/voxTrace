<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">
  <defs>
    <marker id="fc" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#0891b2"/></marker>
    <marker id="fa" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#d97706"/></marker>
    <marker id="fg" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#64748b"/></marker>
    <marker id="fr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#dc2626"/></marker>
  </defs>
  <!-- atom -->
  <circle cx="300" cy="170" r="14" fill="#94a3b8"/>
  <text x="300" y="175" text-anchor="middle" font-size="11" fill="#fff">Cu</text>
  <circle cx="300" cy="170" r="55" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="300" cy="170" r="100" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="352" y="150" font-size="11" fill="#64748b">K shell</text>
  <text x="397" y="118" font-size="11" fill="#64748b">L shell</text>
  <!-- K electron being ejected -->
  <circle cx="245" cy="170" r="6" fill="#64748b"/>
  <line x1="245" y1="164" x2="205" y2="80" stroke="#64748b" stroke-width="2" marker-end="url(#fg)"/>
  <text x="120" y="70" font-size="12" fill="#64748b">photoelectron ejected</text>
  <!-- incoming photon -->
  <path d="M60,240 q15,-12 30,0 q15,12 30,0 q15,-12 30,0 q15,12 30,0 L239,208" fill="none" stroke="#0891b2" stroke-width="2.5" marker-end="url(#fc)"/>
  <text x="60" y="268" fill="#0e7490" font-size="12">incoming beam photon (E &gt; K edge)</text>
  <!-- L->K transition -->
  <circle cx="300" cy="70" r="6" fill="#64748b"/>
  <path d="M300,78 C305,110 305,130 301,152" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#fg)"/>
  <text x="313" y="112" font-size="11" fill="#64748b">L→K</text>
  <!-- branch A: fluorescence -->
  <path d="M355,190 q15,-12 30,0 q15,12 30,0 q15,-12 30,0 q15,12 30,0 L500,187" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#fa)"/>
  <text x="512" y="180" fill="#b45309" font-size="12" font-weight="bold">Kα fluorescence photon</text>
  <text x="512" y="197" fill="#b45309" font-size="12">(8.05 keV — the signal)</text>
  <text x="512" y="215" fill="#64748b" font-size="11">probability = fluorescence yield ω</text>
  <!-- branch B: Auger -->
  <line x1="340" y1="230" x2="470" y2="286" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#fr)"/>
  <text x="482" y="284" fill="#dc2626" font-size="12">Auger electron instead — no photon,</text>
  <text x="482" y="300" fill="#dc2626" font-size="12">this thread returns (probability 1 − ω)</text>
  <text x="380" y="330" text-anchor="middle" font-size="12" fill="#64748b">the code's dice: getExcitedShell → Fluor_Y(shell) survival roll → Line_Energy(transition)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">
  <defs>
    <marker id="ea" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#d97706"/></marker>
    <marker id="eg" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5 z" fill="#94a3b8"/></marker>
  </defs>
  <!-- divider -->
  <line x1="380" y1="20" x2="380" y2="270" stroke="#e2e8f0" stroke-width="2"/>
  <!-- LEFT: analog -->
  <text x="190" y="35" text-anchor="middle" font-weight="bold">analog MC (vr = 0)</text>
  <circle cx="180" cy="160" r="6" fill="#334155"/>
  <g stroke="#94a3b8" stroke-width="1.6">
    <line x1="180" y1="160" x2="120" y2="90" marker-end="url(#eg)"/>
    <line x1="180" y1="160" x2="200" y2="75" marker-end="url(#eg)"/>
    <line x1="180" y1="160" x2="255" y2="105" marker-end="url(#eg)"/>
    <line x1="180" y1="160" x2="95"  y2="160" marker-end="url(#eg)"/>
    <line x1="180" y1="160" x2="115" y2="225" marker-end="url(#eg)"/>
    <line x1="180" y1="160" x2="200" y2="245" marker-end="url(#eg)"/>
    <line x1="180" y1="160" x2="265" y2="215" marker-end="url(#eg)"/>
  </g>
  <line x1="180" y1="160" x2="295" y2="146" stroke="#d97706" stroke-width="2.5" marker-end="url(#ea)"/>
  <!-- window -->
  <line x1="305" y1="128" x2="305" y2="168" stroke="#d97706" stroke-width="5"/>
  <text x="313" y="140" font-size="11" fill="#b45309">collection</text>
  <text x="313" y="154" font-size="11" fill="#b45309">window</text>
  <text x="190" y="272" text-anchor="middle" font-size="12">emit in a random direction —</text>
  <text x="190" y="289" text-anchor="middle" font-size="12">almost all miss and are discarded</text>
  <!-- RIGHT: importance sampling -->
  <text x="570" y="35" text-anchor="middle" font-weight="bold">importance sampling (vr = 1)</text>
  <circle cx="500" cy="160" r="6" fill="#334155"/>
  <line x1="500" y1="160" x2="655" y2="146" stroke="#d97706" stroke-width="2.5" marker-end="url(#ea)"/>
  <line x1="665" y1="124" x2="665" y2="172" stroke="#d97706" stroke-width="5"/>
  <text x="673" y="140" font-size="11" fill="#b45309">aim at a random</text>
  <text x="673" y="154" font-size="11" fill="#b45309">point of the window</text>
  <text x="570" y="240" text-anchor="middle" font-size="12">always aims — but carries the honest weight</text>
  <text x="570" y="262" text-anchor="middle" font-family="monospace" font-size="13" fill="#b45309">wEmit = A·cosθ / (4π r²)</text>
  <text x="570" y="284" text-anchor="middle" font-size="12" fill="#64748b">= the chance isotropic emission would have hit</text>
</svg>

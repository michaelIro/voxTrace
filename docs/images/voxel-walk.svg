<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">
  <defs>
    <marker id="vc" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#0891b2"/></marker>
    <marker id="vr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#dc2626"/></marker>
  </defs>
  <!-- voxel grid 8x4, some voxels a different material -->
  <g stroke="#94a3b8" stroke-width="1">
    <rect x="120" y="70" width="480" height="200" fill="#f8fafc"/>
    <rect x="240" y="120" width="60" height="50" fill="#fde8cc"/>
    <rect x="300" y="120" width="60" height="50" fill="#fde8cc"/>
    <rect x="300" y="170" width="60" height="50" fill="#fde8cc"/>
    <rect x="420" y="220" width="60" height="50" fill="#fde8cc"/>
    <g fill="none">
      <path d="M120,120 h480 M120,170 h480 M120,220 h480"/>
      <path d="M180,70 v200 M240,70 v200 M300,70 v200 M360,70 v200 M420,70 v200 M480,70 v200 M540,70 v200"/>
    </g>
  </g>
  <text x="360" y="58" text-anchor="middle" font-weight="bold">sample surface</text>
  <line x1="120" y1="70" x2="600" y2="70" stroke="#a07c33" stroke-width="3"/>
  <text x="626" y="150" font-size="12" fill="#b45309">amber voxels:</text>
  <text x="626" y="166" font-size="12" fill="#b45309">different material,</text>
  <text x="626" y="182" font-size="12" fill="#b45309">different µ</text>
  <!-- interacting ray -->
  <line x1="80" y1="30" x2="150" y2="82" stroke="#0891b2" stroke-width="2.5"/>
  <polyline points="150,82 210,127 262,166 322,211" fill="none" stroke="#0891b2" stroke-width="2.5"/>
  <g font-size="11" fill="#0e7490">
    <text x="150" y="110">µ₁·ℓ₁</text>
    <text x="212" y="155">µ₁·ℓ₂</text>
    <text x="256" y="200">µ₂·ℓ₃</text>
  </g>
  <!-- interaction star -->
  <g transform="translate(322,211)">
    <path d="M0,-9 L2.5,-2.5 L9,0 L2.5,2.5 L0,9 L-2.5,2.5 L-9,0 L-2.5,-2.5 Z" fill="#0891b2"/>
  </g>
  <text x="336" y="232" font-size="12" fill="#0e7490">budget τ spent → interacts here</text>
  <!-- pass-through ray -->
  <line x1="150" y1="30" x2="240" y2="76" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <polyline points="240,76 420,168 560,240" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="560" y1="240" x2="620" y2="272" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#vr)"/>
  <text x="500" y="290" font-size="12" fill="#dc2626">crosses the whole sample → discarded</text>
  <text x="360" y="310" text-anchor="middle" font-size="12" fill="#64748b">each photon draws its attenuation budget τ = −ln U, then pays µ·ℓ voxel by voxel until it is spent</text>
</svg>

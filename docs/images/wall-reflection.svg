<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">
  <defs>
    <marker id="wc" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#0891b2"/></marker>
    <marker id="wr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#dc2626"/></marker>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="1.5"/>
    </pattern>
  </defs>
  <!-- glass wall -->
  <rect x="60" y="40" width="640" height="45" fill="url(#hatch)" stroke="#94a3b8"/>
  <text x="380" y="30" text-anchor="middle">capillary glass wall</text>
  <!-- channel interior label -->
  <text x="380" y="255" text-anchor="middle" fill="#64748b" font-size="12">open channel (vacuum/air) — the photon flies here</text>
  <!-- incident ray, grazing -->
  <line x1="80" y1="180" x2="330" y2="88" stroke="#0891b2" stroke-width="2.5"/>
  <!-- reflected ray -->
  <line x1="330" y1="88" x2="600" y2="185" stroke="#0891b2" stroke-width="2.5" marker-end="url(#wc)"/>
  <circle cx="330" cy="88" r="4" fill="#0891b2"/>
  <!-- absorbed component into glass -->
  <line x1="330" y1="88" x2="410" y2="58" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#wr)"/>
  <text x="418" y="56" fill="#dc2626" font-size="12">small part refracts into the glass — lost</text>
  <!-- angle annotation -->
  <path d="M255,86 A70,70 0 0 1 258,116" fill="none" stroke="#334155" stroke-width="1.2"/>
  <text x="212" y="112" font-size="12">grazing angle θ (≪ 1°)</text>
  <!-- labels -->
  <text x="90" y="200" fill="#0e7490" font-size="12">incident photon, weight w</text>
  <text x="470" y="210" fill="#0e7490" font-size="12">specularly reflected, weight reduced:</text>
  <text x="470" y="230" font-size="13" font-family="monospace" fill="#0e7490">w ← w · (Rs·fs + Rp·fp) · e⁻ᴰᵂ</text>
  <text x="60" y="130" font-size="12" fill="#64748b">Fresnel reflectivity Rs, Rp: high only at grazing angles</text>
  <text x="60" y="148" font-size="12" fill="#64748b">and low energies; Debye–Waller e⁻ᴰᵂ pays for roughness</text>
</svg>
